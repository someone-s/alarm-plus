name: Manual Build CI

on:
  workflow_dispatch:

jobs:

  build-apk:

    runs-on: ubuntu-latest
    
    environment: production

    env:
      ARTIFACT_NAME: signed apk release
      ARTIFACT_PATH: test_build_signed.apk

    outputs:
      ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
      ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup signing info
      run: |
        mkdir -p app/keystore/
        touch app/keystore/release.jks
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/keystore/release.jks

        mkdir -p ~/.gradle/
        touch ~/.gradle/gradle.properties
        echo "RELEASE_STORE_FILE=keystore/release.jks" >> ~/.gradle/gradle.properties
        echo "RELEASE_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> ~/.gradle/gradle.properties
        echo "RELEASE_KEY_ALIAS=${{ secrets.ALIAS }}" >> ~/.gradle/gradle.properties
        echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
        
    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Move file 
      run: mv app/build/outputs/apk/release/app-release.apk ${{ env.ARTIFACT_PATH }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_PATH }}

  build-aab:

    runs-on: ubuntu-latest

    environment: production

    env:
      ARTIFACT_NAME: signed aab release
      ARTIFACT_PATH: test_build_signed.aab

    outputs:
      ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
      ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup signing info
      run: |
        mkdir -p app/keystore/
        touch app/keystore/release.jks
        echo ${{ secrets.SIGNING_KEY }} | base64 -d > app/keystore/release.jks
        
        mkdir -p ~/.gradle/
        touch ~/.gradle/gradle.properties
        echo "RELEASE_STORE_FILE=keystore/release.jks" >> ~/.gradle/gradle.properties
        echo "RELEASE_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> ~/.gradle/gradle.properties
        echo "RELEASE_KEY_ALIAS=${{ secrets.ALIAS }}" >> ~/.gradle/gradle.properties
        echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> ~/.gradle/gradle.properties
        
    - name: Build with Gradle
      run: ./gradlew :app:bundleRelease

    - name: Move file 
      run: mv app/build/outputs/bundle/release/app-release.aab ${{ env.ARTIFACT_PATH }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path:  ${{ env.ARTIFACT_PATH }}
